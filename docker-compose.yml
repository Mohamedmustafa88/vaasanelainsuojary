services:
  db:
    image: postgres:16
    container_name: elainsuoja-db
    environment:
      POSTGRES_USER: elainsuoja
      POSTGRES_PASSWORD: elainsuoja
      POSTGRES_DB: elainsuoja
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Kaikki .sql-tiedostot tässä kansiossa ajetaan automaattisesti ensimmäisellä käynnistyskerralla
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elainsuoja -d elainsuoja"]
      interval: 5s
      timeout: 5s
      retries: 10

